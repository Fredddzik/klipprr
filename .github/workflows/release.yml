# Build ClipAgent (signed + notarized on macOS), create GitHub Release, upload updater artifacts.
# Trigger: push a version tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
#
# Required repo variables (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_SUPABASE_URL      - Supabase project URL (for frontend build)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY - Supabase anon key (for frontend build)
# Required secrets:
#   TAURI_SIGNING_PRIVATE_KEY  - base64 of updater private key file (base64 -i ~/.tauri/clipagent.key | tr -d '\n'). (1) Key with password: set TAURI_SIGNING_PRIVATE_KEY_PASSWORD too. (2) Unencrypted: rsign generate -W then base64 the .key file; pubkey in tauri.conf.json.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - only if key was generated with a password (leave unset for unencrypted key)
#   APPLE_CERTIFICATE          - base64 of Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD - password for the .p12
#   KEYCHAIN_PASSWORD          - password for the temporary keychain
#   APPLE_ID                   - Apple ID email
#   APPLE_PASSWORD             - app-specific password (not main Apple password)
#   APPLE_TEAM_ID              - Team ID from Apple Developer
# Optional (to have public downloads while repo is private):
#   RELEASES_PUBLIC_REPO       - Variable: public repo for releases only (e.g. Fredddzik/klipprr-releases)
#   RELEASES_PUBLIC_REPO_TOKEN - Secret: PAT with repo scope, to create releases in that public repo
# See doc/WINDOWS_RELEASE_PLAN.md for Windows (unsigned build; signing is optional).
#
# Windows job runs after the Mac job and adds a .msi to the same release. To re-run only
# the Windows build (e.g. after a fix) without burning macOS minutes: Actions → Release
# → Run workflow → set "Only run Windows build..." to true and version (e.g. 0.1.12).
#
# Test Windows build locally before pushing (catches Rust errors, no CI minutes):
#   rustup target add x86_64-pc-windows-msvc
#   cd cliptool && npm run build
#   cd clipagent/src-tauri && cargo check --target x86_64-pc-windows-msvc

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0). Must match tauri.conf.json. Ignored on tag push."
        required: false
      windows_only:
        description: "Only run Windows build and attach to existing release (saves macOS minutes)."
        required: false
        default: false
        type: boolean

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.windows_only != 'true'
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd cliptool && npm ci && npm run build

      - name: Check for Apple signing
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then echo "enabled=true" >> $GITHUB_OUTPUT; else echo "enabled=false" >> $GITHUB_OUTPUT; fi

      - name: Import Apple Developer Certificate
        if: steps.apple.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Using signing identity: $CERT_ID"

      - name: Sign resource binaries (for notarization)
        if: steps.apple.outputs.enabled == 'true'
        run: |
          BIN_DIR="clipagent/src-tauri/bin"
          ENTITLEMENTS="clipagent/src-tauri/entitlements-binaries.plist"
          for name in ffmpeg ffprobe; do
            path="$BIN_DIR/$name"
            if [ -f "$path" ]; then
              echo "Signing $path"
              codesign --force --options runtime --timestamp -s "$CERT_ID" -- "$path"
            fi
          done
          # yt-dlp is PyInstaller; extracted Python has different Team ID - need disable-library-validation
          if [ -f "$BIN_DIR/yt-dlp" ]; then
            echo "Signing yt-dlp with entitlements (allow embedded Python load)"
            codesign --force --options runtime --timestamp -s "$CERT_ID" --entitlements "$ENTITLEMENTS" -- "$BIN_DIR/yt-dlp"
          fi

      - name: Tauri build and release
        id: tauri
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # So build.rs embeds these when .env.local is missing (CI); desktop sync then has URL/key.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        with:
          projectPath: clipagent
          tagName: v__VERSION__
          releaseName: 'Klipprr v__VERSION__'
          releaseBody: 'macOS beta. Download the .dmg (drag to Applications) or .app.tar.gz below.'
          releaseDraft: false
          args: '--target aarch64-apple-darwin --bundles app,dmg'

      - name: Mirror release to public repo (optional)
        if: vars.RELEASES_PUBLIC_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ${{ vars.RELEASES_PUBLIC_REPO }}
        run: |
          VERSION=$(cat clipagent/src-tauri/tauri.conf.json | grep '"version"' | head -1 | sed 's/.*: *"\([^"]*\)".*/\1/')
          TAG="v${VERSION}"
          BUNDLE_MACOS="clipagent/src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          BUNDLE_DMG="clipagent/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          # Find .app.tar.gz (Tauri may name it Klipprr_aarch64.app.tar.gz or Klipprr_0.1.3_aarch64.app.tar.gz)
          APP_TAR_GZ=$(echo "$BUNDLE_MACOS"/Klipprr*.app.tar.gz | awk '{print $1}')
          APP_SIG="${APP_TAR_GZ}.sig"
          [ -f "$APP_TAR_GZ" ] || { echo "No .app.tar.gz found in $BUNDLE_MACOS"; ls -la "$BUNDLE_MACOS" || true; exit 1; }
          [ -f "$APP_SIG" ] || { echo "No .sig for $APP_TAR_GZ"; exit 1; }
          APP_TAR_GZ_BASENAME=$(basename "$APP_TAR_GZ")
          FILES=("$APP_TAR_GZ" "$APP_SIG")
          for f in "$BUNDLE_DMG"/*.dmg; do
            [ -f "$f" ] && FILES+=("$f")
          done
          if ! gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "Creating release $TAG in $PUBLIC_REPO (app bundle: $APP_TAR_GZ_BASENAME)"
            gh release create "$TAG" --repo "$PUBLIC_REPO" --title "Klipprr $TAG" --notes "macOS beta. Download the .dmg (drag to Applications) or .app.tar.gz below."
          else
            echo "Release $TAG already exists in $PUBLIC_REPO, uploading assets."
          fi
          gh release upload "$TAG" --repo "$PUBLIC_REPO" "${FILES[@]}" --clobber
          # Generate latest.json so "Check for updates" works (URL must match the uploaded asset name).
          SIGNATURE=$(cat "$APP_SIG" | jq -Rs .)
          DOWNLOAD_URL="https://github.com/${PUBLIC_REPO}/releases/download/${TAG}/${APP_TAR_GZ_BASENAME}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"version\":\"${VERSION}\",\"notes\":\"\",\"pub_date\":\"${PUB_DATE}\",\"platforms\":{\"darwin-aarch64\":{\"signature\":${SIGNATURE},\"url\":\"${DOWNLOAD_URL}\"}}}" > latest.json
          gh release upload "$TAG" --repo "$PUBLIC_REPO" latest.json --clobber

  # Windows build (unsigned). Runs after Mac job; uploads .msi to same release.
  # continue-on-error: true so a Windows failure does not mark the workflow failed (Mac release is already done).
  release-windows:
    if: github.event.inputs.windows_only != 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    needs: release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd cliptool && npm ci && npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Download Windows ffmpeg and ffprobe
        run: |
          $binDir = "clipagent\src-tauri\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $api = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          $zipUrl = ($api.assets | Where-Object { $_.name -match "win64-gpl\.zip$" -and $_.name -notmatch "shared" } | Select-Object -First 1).browser_download_url
          Invoke-WebRequest -Uri $zipUrl -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffmpeg.exe | Copy-Item -Destination $binDir -Force
          Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffprobe.exe | Copy-Item -Destination $binDir -Force
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_extract

      - name: Download Windows yt-dlp
        shell: bash
        run: |
          BIN_DIR="clipagent/src-tauri/bin"
          curl -sL -o "$BIN_DIR/yt-dlp.exe" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"

      - name: Tauri build (Windows MSI)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd clipagent/src-tauri
          cargo tauri build --bundles msi

      - name: Upload Windows asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $msi = Get-ChildItem -Path "clipagent\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { gh release upload $tag $msi.FullName --clobber; echo "Uploaded $($msi.Name)" } else { echo "No .msi found"; exit 1 }

      - name: Mirror Windows asset to public repo
        if: vars.RELEASES_PUBLIC_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ${{ vars.RELEASES_PUBLIC_REPO }}
        run: |
          $tag = "${{ github.ref_name }}"
          $msi = Get-ChildItem -Path "clipagent\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            gh release upload $tag $msi.FullName --repo $env:PUBLIC_REPO --clobber
            echo "Mirrored $($msi.Name) to $env:PUBLIC_REPO"
          }

  # Same as release-windows but no Mac job: for re-running only Windows and attaching to existing release.
  release-windows-only:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.windows_only == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ github.event.inputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd cliptool && npm ci && npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Download Windows ffmpeg and ffprobe
        run: |
          $binDir = "clipagent\src-tauri\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $api = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          $zipUrl = ($api.assets | Where-Object { $_.name -match "win64-gpl\.zip$" -and $_.name -notmatch "shared" } | Select-Object -First 1).browser_download_url
          Invoke-WebRequest -Uri $zipUrl -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffmpeg.exe | Copy-Item -Destination $binDir -Force
          Get-ChildItem -Path ffmpeg_extract -Recurse -Filter ffprobe.exe | Copy-Item -Destination $binDir -Force
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_extract

      - name: Download Windows yt-dlp
        shell: bash
        run: |
          BIN_DIR="clipagent/src-tauri/bin"
          curl -sL -o "$BIN_DIR/yt-dlp.exe" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"

      - name: Tauri build (Windows MSI)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd clipagent/src-tauri
          cargo tauri build --bundles msi

      - name: Upload Windows asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ github.event.inputs.version }}"
          $msi = Get-ChildItem -Path "clipagent\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { gh release upload $tag $msi.FullName --clobber; echo "Uploaded $($msi.Name)" } else { echo "No .msi found"; exit 1 }

      - name: Mirror Windows asset to public repo
        if: vars.RELEASES_PUBLIC_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ${{ vars.RELEASES_PUBLIC_REPO }}
        run: |
          $tag = "v${{ github.event.inputs.version }}"
          $msi = Get-ChildItem -Path "clipagent\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            gh release upload $tag $msi.FullName --repo $env:PUBLIC_REPO --clobber
            echo "Mirrored $($msi.Name) to $env:PUBLIC_REPO"
          }
