# When yt-dlp releases a new version: update the bundled binary, bump app version, and push a tag
# so the Release workflow runs and publishes a Tauri update to users.
#
# Trigger: daily schedule (noon UTC) or manual "Run workflow".
# Requires: default branch is main; GITHUB_TOKEN has contents: write (default in repo).

name: Update yt-dlp

on:
  schedule:
    - cron: '0 12 * * 1'  # Mondays — yt-dlp releases ~every 2-4 weeks
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
      actions: read
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Get latest yt-dlp release
        id: ytdlp
        env:
          # Authenticated requests get 5000 req/hr instead of 60/hr — unauthenticated
          # calls from shared Actions runner IPs were intermittently rate-limited,
          # which made this step fail with a cryptic "jq: Cannot iterate over null" error.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest"
          RESPONSE=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API")
          TAG=$(echo "$RESPONSE" | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "::error::Failed to resolve latest yt-dlp release. API response:"
            echo "$RESPONSE"
            exit 1
          fi
          URL=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name == "yt-dlp_macos") | .browser_download_url')
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "download_url=$URL" >> $GITHUB_OUTPUT
          echo "Latest yt-dlp: $TAG"

      - name: Skip if no new version
        id: skip
        run: |
          LATEST="${{ steps.ytdlp.outputs.tag_name }}"
          # The pinned version lives in tools.lock. It used to be read from
          # bin/yt-dlp.version, but that file left the repo when yt-dlp stopped being
          # committed — so this check saw no current version, never skipped, and bumped
          # the app version every week whether or not yt-dlp had actually changed.
          LOCK="clipagent/src-tauri/tools.lock"
          CURRENT=""
          if [ -f "$LOCK" ]; then
            CURRENT=$(grep -E '^YT_DLP_VERSION=' "$LOCK" | cut -d= -f2 | tr -d '[:space:]')
          fi
          echo "pinned=$CURRENT latest=$LATEST"
          # Skip when we already have this version or something newer (version sort: YYYY.MM.DD)
          if [ -n "$CURRENT" ]; then
            NEWER=$(printf '%s\n' "$CURRENT" "$LATEST" | sort -V | tail -n1)
            if [ "$NEWER" = "$CURRENT" ]; then
              echo "Current ($CURRENT) is up to date or newer than latest ($LATEST), skipping"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      # Bump the pinned version only. The binary itself is fetched at build time and is
      # not committed — committing it weekly is what grew .git to 388 MB.
      - name: Bump pinned yt-dlp version
        if: steps.skip.outputs.skip != 'true'
        run: |
          LOCK="clipagent/src-tauri/tools.lock"
          NEW="${{ steps.ytdlp.outputs.tag_name }}"
          sed -i '' "s/^YT_DLP_VERSION=.*/YT_DLP_VERSION=$NEW/" "$LOCK"
          grep -E '^YT_DLP_VERSION=' "$LOCK"

      # Prove the pinned release actually exists and its checksum verifies before we
      # commit a version that would break every subsequent build.
      - name: Verify the pinned version downloads and checksums
        if: steps.skip.outputs.skip != 'true'
        run: ./scripts/fetch-yt-dlp.sh macos

      - name: Bump app version (patch)
        if: steps.skip.outputs.skip != 'true'
        run: |
          cd clipagent/src-tauri
          # tauri.conf.json
          VER=$(jq -r '.version' tauri.conf.json)
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
          jq --arg v "$NEW_VER" '.version = $v' tauri.conf.json > tauri.conf.json.tmp && mv tauri.conf.json.tmp tauri.conf.json
          # Cargo.toml
          sed -i '' "s/^version = \".*\"$/version = \"$NEW_VER\"/" Cargo.toml
          # Cargo.lock records the app's own version too; left alone it goes stale.
          perl -0pi -e "s/(name = \"clipagent\"\nversion = \")[^\"]+/\${1}$NEW_VER/" Cargo.lock
          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_ENV
          echo "Bumped to $NEW_VER"

      - name: Commit and push
        if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clipagent/src-tauri/tools.lock \
            clipagent/src-tauri/tauri.conf.json clipagent/src-tauri/Cargo.toml \
            clipagent/src-tauri/Cargo.lock
          git diff --staged --quiet && exit 0 || true
          # No [skip ci] here. GitHub applies it to the tag pushed below as well, since the tag
          # points at this commit: v0.1.41 and v0.1.42 were tagged and never built, and users
          # stayed on the August yt-dlp. This push uses GITHUB_TOKEN, which triggers nothing.
          git commit -m "chore: update yt-dlp to ${{ steps.ytdlp.outputs.tag_name }}"
          git push origin main

      # The tag MUST be pushed with a personal access token, not the default GITHUB_TOKEN.
      # GitHub refuses to trigger workflows from events created by its own token, so a tag
      # pushed with GITHUB_TOKEN builds nothing at all — no run, no failure, no signal.
      # That is exactly how releases silently stopped after v0.1.24: every tag from
      # v0.1.25 onward was created by this job and never produced a build, and nobody
      # noticed for four months. Fail loudly rather than tag into the void.
      - name: Create and push tag
        if: steps.skip.outputs.skip != 'true'
        env:
          TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN || secrets.RELEASES_PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$TAG_TOKEN" ]; then
            echo "::error::No RELEASE_TAG_TOKEN (or RELEASES_PUBLIC_REPO_TOKEN) secret set."
            echo "::error::A tag pushed with the default GITHUB_TOKEN does not trigger the"
            echo "::error::Release workflow, so it would produce no build. Refusing to tag."
            exit 1
          fi
          git tag "v${{ env.NEW_VERSION }}"
          git push "https://x-access-token:${TAG_TOKEN}@github.com/${{ github.repository }}" "v${{ env.NEW_VERSION }}"
          echo "Tagged v${{ env.NEW_VERSION }} — the Release workflow should now be running."

      # Twice now a tag has silently produced no build, each time for a different reason.
      # Whatever the next reason is, this job goes red instead of green.
      - name: Check the tag started a release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.NEW_VERSION }}"
          for _ in $(seq 1 12); do
            sleep 15
            COUNT=$(gh run list --repo "${{ github.repository }}" --workflow release.yml --branch "$TAG" --json databaseId --jq length)
            if [ "$COUNT" -gt 0 ]; then
              echo "Release is running for $TAG."
              exit 0
            fi
          done
          echo "::error::$TAG was pushed but no Release run started. Users will not get this update."
          exit 1
