<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your verification code</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f2ff;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#171717;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f2ff;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #ece8ff;">
            <tr>
              <td style="padding:24px;background:linear-gradient(135deg,#5a2dff 0%,#7c3cff 25%,#c935ff 60%,#ff2e92 100%);color:#ffffff;font-size:22px;font-weight:700;">
                Klipprr
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px 8px 24px;font-size:24px;line-height:1.3;font-weight:700;">
                Confirm it is you
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 8px 24px;font-size:15px;line-height:1.6;color:#404040;">
                Enter this verification code to complete your action:
              </td>
            </tr>
            <tr>
              <td style="padding:12px 24px 20px 24px;">
                <div style="display:inline-block;background:#f4f2ff;border:1px solid #ddd4ff;border-radius:12px;padding:12px 16px;font-size:28px;letter-spacing:4px;font-weight:700;color:#5a2dff;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 24px 24px;font-size:13px;line-height:1.6;color:#6b6b6b;">
                If you did not request this code, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
