<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You are invited to Klipprr</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f2ff;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#171717;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f2ff;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #ece8ff;">
            <tr>
              <td style="padding:24px;background:linear-gradient(135deg,#5a2dff 0%,#7c3cff 25%,#c935ff 60%,#ff2e92 100%);color:#ffffff;font-size:22px;font-weight:700;">
                Klipprr
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px 8px 24px;font-size:24px;line-height:1.3;font-weight:700;">
                You have been invited
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 8px 24px;font-size:15px;line-height:1.6;color:#404040;">
                You were invited to create an account on {{ .SiteURL }}. Accept the invite to get started.
              </td>
            </tr>
            <tr>
              <td style="padding:20px 24px 8px 24px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#7c3aed;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 18px;border-radius:10px;">
                  Accept invite
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 24px 0 24px;font-size:13px;line-height:1.6;color:#6b6b6b;">
                If the button does not work, copy and paste this link into your browser:
              </td>
            </tr>
            <tr>
              <td style="padding:4px 24px 24px 24px;word-break:break-all;font-size:13px;line-height:1.5;color:#7c3aed;">
                {{ .ConfirmationURL }}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
